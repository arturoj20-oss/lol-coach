<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: https://ddragon.leagueoflegends.com https://raw.communitydragon.org https://cmsassets.rgpub.io">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoL Coach</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="views/home.css">
  <link rel="stylesheet" href="views/select.css">
  <link rel="stylesheet" href="views/history.css">
  <link rel="stylesheet" href="views/patch.css">
  <link rel="stylesheet" href="views/settings.css">
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <div class="update-bar" id="updateBar" role="status" hidden></div>
  <main id="views">
    <section class="view" id="view-home" hidden></section>
    <section class="view" id="view-select" hidden></section>
    <section class="view" id="view-history" hidden></section>
    <section class="view" id="view-patch" hidden></section>
    <section class="view" id="view-settings" hidden></section>
  </main>
  <div id="toasts" aria-live="polite"></div>

  <!-- mock-api.js solo actua si no hay window.api (abierto fuera de Electron o sin preload) -->
  <script src="mock-api.js"></script>
  <script src="util.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
  <script src="views/home.js"></script>
  <script src="views/select.js"></script>
  <script src="views/history.js"></script>
  <script src="views/patch.js"></script>
  <script src="views/settings.js"></script>
</body>
</html>
